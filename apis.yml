aid: pax
name: Pax
description: 'Pax (Pax AI) is a San Francisco-based artificial intelligence company that automates U.S.
  duty drawback claims, letting importers, retailers, and manufacturers reclaim overpaid tariffs and
  import duties. Branding itself the "AI Broker for Tariff Refunds" and "TurboTax for import duty rebate,"
  Pax uses proprietary AI to automate data extraction, validation, transaction matching, refund
  calculation, and electronic claim submission to U.S. Customs and Border Protection with minimal manual
  effort. Founded by former duty-drawback experts and engineers from Charter Brokerage, MIT, Amazon,
  Flexport, and Brex, Pax is backed by Y Combinator, Initialized Capital, General Catalyst, Flexport,
  Soma Capital, Basis Set Ventures, and others. This profile was enriched by the API Evangelist pipeline.'
